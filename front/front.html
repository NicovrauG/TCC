<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Coleta EMG + Vídeo</title>
</head>
<body>
    <h1>Coleta de Dados</h1>
    <button onclick="iniciarColeta()">Iniciar Coleta</button>
    <div id="resultado"></div>

    <script>
        async function iniciarColeta() {
            const response = await fetch("/start", { method: "POST" });
            if (!response.ok) {
                document.getElementById("resultado").innerText = "Erro ao iniciar coleta: " + response.status;
                return;
            }
            const data = await response.json();
            const id = data.id;

            document.getElementById("resultado").innerHTML = `
                <p>Coleta salva com ID: ${id}</p>
                <a href="/csv/${id}" target="_blank">Baixar CSV</a><br>
                <video width="480" controls>
                    <source src="/video/${id}" type="video/mp4">
                </video>
            `;
        }
    </script>
</body>
</html>
