<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Coletas de EMG + Vídeo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #2b6777;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    header button {
      background: #52ab98;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 5px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    header button:hover {
      background: #3c8d7a;
    }

    main {
      padding: 2rem;
      max-width: 1110px;
      margin: auto;
    }

    h2 {
      margin-top: 2rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 0.5rem;
      color: #2b6777;
    }

    #listaColetas {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .card {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card button {
      margin-top: 0.5rem;
      background: #52ab98;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .card button:hover {
      background: #3c8d7a;
    }

    #resultado {
      margin-top: 1rem;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Modal */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 0.6rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-content button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem;
      background: #2b6777;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: #1f4d5a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Coletas EMG + Vídeo</h1>
    <button onclick="abrirModal()">+ Nova Coleta</button>
  </header>

  <main>
    <h2>Resultado da Coleta Atual</h2>
    <div id="resultado">Nenhuma coleta em andamento</div>

    <h2>Histórico de Coletas</h2>
    <ul id="listaColetas"></ul>
  </main>

  <!-- Modal para nova coleta -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Nova Coleta</h3>
      <input type="text" id="nome" placeholder="Nome do paciente" required>
      <input type="number" id="idade" placeholder="Idade" required>
      <button onclick="iniciarColeta()">Iniciar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    function abrirModal() {
      document.getElementById("modal").style.display = "flex";
    }
    function fecharModal() {
      document.getElementById("modal").style.display = "none";
    }

    async function carregarColetas() {
      const response = await fetch("/coletas");
      const coletas = await response.json();
      const lista = document.getElementById("listaColetas");
      lista.innerHTML = "";
      coletas.forEach(c => {
        const li = document.createElement("li");
        li.classList.add("card");
        li.innerHTML = `
          <strong>${c.nome}</strong><br>
          ${c.idade} anos<br>
          <small>${c.data}</small><br>
          <button onclick="mostrarColeta(${c.id})">Ver</button>
        `;
        lista.appendChild(li);
      });
    }

    async function mostrarColeta(id) {
    // carrega vídeo
    document.getElementById("resultado").innerHTML = `
      <video id="videoPlayer" width="480" controls>
        <source src="/video/${id}" type="video/mp4">
      </video>
      <h3>Sinal EMG</h3>
      <img src="grafico/${id}" width="1080">
      <a href="/csv/${id}" target="_blank">Baixar CSV</a><br><br>
    `;
    }


    async function iniciarColeta() {
      const nome = document.getElementById("nome").value;
      const idade = parseInt(document.getElementById("idade").value);

      if (!nome || !idade) {
        alert("Preencha todos os campos!");
        return;
      }

      fecharModal();
      document.getElementById("resultado").innerHTML = "Coletando dados...";

      const response = await fetch("/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({nome, idade})
      });

      if (!response.ok) {
        document.getElementById("resultado").innerText = "Erro ao iniciar coleta: " + response.status;
        return;
      }

      const data = await response.json();
      document.getElementById("resultado").innerHTML = `
        <p>✅ Coleta salva com ID: ${data.id}</p>
      `;
      carregarColetas();
    }

    carregarColetas();
  </script>
</body>
</html>
