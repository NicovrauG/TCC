version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: emg_user
      POSTGRES_PASSWORD: emg
      POSTGRES_DB: projetoemg
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1884:1883"
    restart: always

  fastapi_server:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_USER: emg_user
      DB_PASSWORD: emg
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: projetoemg
    depends_on:
      - db
      - mqtt
    devices:
      - "/dev/video0:/dev/video0"
    privileged: true  
    volumes:
      - dados_e_videos:/app/dados_e_videos
    restart: always

volumes:
  db_data:
  dados_e_videos:
